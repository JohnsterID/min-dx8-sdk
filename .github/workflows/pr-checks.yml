name: Pull Request Checks

on:
  pull_request:
    branches:
      - mingw-w64-compatibility
      - main
      - mingw-64bit-support

jobs:
  # Fast checks that must pass
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check commit authorship
        run: |
          echo "=== Validating commit authorship ==="
          
          # Get all commits in this PR
          git fetch origin ${{ github.base_ref }}
          
          # Check each commit
          for commit in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            author=$(git show -s --format='%ae' $commit)
            committer=$(git show -s --format='%ce' $commit)
            message=$(git show -s --format='%B' $commit)
            
            echo "Checking commit: $commit"
            echo "  Author: $author"
            echo "  Committer: $committer"
            
            # Check for openhands in author/committer (should not exist per guidelines)
            if echo "$author" | grep -qi "openhands"; then
              echo "ERROR: Commit has openhands as author"
              exit 1
            fi
            
            if echo "$committer" | grep -qi "openhands"; then
              echo "ERROR: Commit has openhands as committer"
              exit 1
            fi
            
            # Check for Co-authored-by (should not exist per guidelines)
            if echo "$message" | grep -qi "Co-authored-by"; then
              echo "ERROR: Commit message contains Co-authored-by"
              exit 1
            fi
            
            echo "  ✓ Commit authorship OK"
          done
          
          echo "All commits have correct authorship"
      
      - name: Style guide compliance
        run: |
          echo "=== Checking STYLE.md compliance ==="
          
          # No emojis
          if grep -r "[🔄✅❌⚠️🔨📁📄🎯⭐🚀✓✗⏭️🏗️]" \
              --include="*.md" --include="*.c" --include="*.cpp" --include="*.h" \
              . 2>/dev/null; then
            echo "ERROR: Emojis found (violates STYLE.md)"
            exit 1
          fi
          echo "✓ No emojis"
          
          # Check for auto keyword misuse (simple heuristic)
          if grep -r "auto " --include="*.cpp" --include="*.c" . 2>/dev/null | \
             grep -v "range-based for" | grep -v "// auto" | grep -v "/\* auto" ; then
            echo "WARNING: Found 'auto' keyword (check STYLE.md rules)"
          fi
          
          echo "Style checks passed"
      
      - name: License compliance
        run: |
          echo "=== Checking license compliance ==="
          
          # GPL3 license exists
          if [ ! -f LICENSE-GPL3.txt ]; then
            echo "ERROR: LICENSE-GPL3.txt missing"
            exit 1
          fi
          
          # Microsoft license notice exists
          if [ ! -f LICENSE-MICROSOFT.txt ]; then
            echo "ERROR: LICENSE-MICROSOFT.txt missing"
            exit 1
          fi
          
          # README mentions licensing
          if ! grep -qi "license" README.md; then
            echo "ERROR: README.md doesn't mention licensing"
            exit 1
          fi
          
          echo "License compliance OK"
      
      - name: Documentation completeness
        run: |
          echo "=== Checking documentation ==="
          
          required_docs=(
            "README.md"
            "STYLE.md"
            "docs/D3D8_STATUS.md"
            "docs/D3D8THK_REFERENCE.md"
            "docs/D3DX8_STATUS.md"
            "docs/TESTING.md"
            "test_d3d8thk/README.md"
          )
          
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "ERROR: Required documentation missing: $doc"
              exit 1
            fi
            echo "✓ $doc"
          done
          
          echo "Documentation complete"
  
  # Compilation check (faster than full CI)
  compile-check:
    name: Compilation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake
      
      - name: Compile 64-bit tests
        run: |
          mkdir -p build-check
          cd build-check
          cmake ../test_d3d8thk \
            -DCMAKE_TOOLCHAIN_FILE=../test_project/toolchain-mingw-w64-x86_64.cmake
          make -j$(nproc)
          
          echo "=== Compiled executables ==="
          ls -lh *.exe
      
      - name: Symbol verification
        run: |
          cd build-check
          
          echo "=== Checking d3d8thk symbols in test_basic.exe ==="
          x86_64-w64-mingw32-nm test_basic.exe | grep OsThunk || {
            echo "ERROR: No OsThunk symbols found"
            exit 1
          }
          
          echo "Symbols verified"
  
  # Summary for PR
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quick-checks, compile-check]
    if: always()
    
    steps:
      - name: Generate PR summary
        run: |
          echo "# Pull Request Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Check Status" >> $GITHUB_STEP_SUMMARY
          echo "- Quick Checks: ${{ needs.quick-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Compilation: ${{ needs.compile-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.quick-checks.result }}" = "success" ] && \
             [ "${{ needs.compile-check.result }}" = "success" ]; then
            echo "## ✓ All checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✗ Some checks failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the issues before merging." >> $GITHUB_STEP_SUMMARY
          fi
