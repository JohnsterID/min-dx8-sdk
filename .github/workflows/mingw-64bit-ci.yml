name: MinGW-w64 64-bit Support CI

on:
  push:
    branches:
      - mingw-64bit-support
  pull_request:
    branches:
      - mingw-w64-compatibility
      - main

jobs:
  # Cross-compile from Linux (fast, no Windows needed)
  cross-compile-linux:
    name: Cross-compile Tests (Linux → Windows)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [i686, x86_64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            cmake \
            build-essential
      
      - name: Verify MinGW-w64 installation
        run: |
          echo "=== Checking ${{ matrix.arch }} toolchain ==="
          ${{ matrix.arch }}-w64-mingw32-gcc --version
          ${{ matrix.arch }}-w64-mingw32-g++ --version
          
          echo "=== Checking d3d8 libraries ==="
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ls -lh /usr/${{ matrix.arch }}-w64-mingw32/lib/libd3d8*.a || echo "No d3d8 libs"
          else
            ls -lh /usr/${{ matrix.arch }}-w64-mingw32/lib/libd3d8*.a
          fi
      
      - name: Build basic link test
        run: |
          mkdir -p build-test-${{ matrix.arch }}
          cd build-test-${{ matrix.arch }}
          
          cmake ../test_project \
            -DCMAKE_TOOLCHAIN_FILE=../test_project/toolchain-mingw-w64-${{ matrix.arch }}.cmake
          
          make VERBOSE=1
      
      - name: Verify test executable
        run: |
          cd build-test-${{ matrix.arch }}
          ls -lh main.exe
          
          echo "=== Checking PE format ==="
          file main.exe
          
          echo "=== Checking DLL dependencies ==="
          ${{ matrix.arch }}-w64-mingw32-objdump -p main.exe | grep "DLL Name" || true
          
          echo "=== Checking D3D8 symbols ==="
          ${{ matrix.arch }}-w64-mingw32-nm main.exe | grep -i direct3d || echo "Symbol check: OK"
      
      - name: Build d3d8thk tests (64-bit only)
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p build-test-d3d8thk
          cd build-test-d3d8thk
          
          cmake ../test_d3d8thk \
            -DCMAKE_TOOLCHAIN_FILE=../test_project/toolchain-mingw-w64-x86_64.cmake
          
          make VERBOSE=1
      
      - name: Verify d3d8thk test executables (64-bit only)
        if: matrix.arch == 'x86_64'
        run: |
          cd build-test-d3d8thk
          
          echo "=== Built test executables ==="
          ls -lh *.exe
          
          echo "=== Checking test_basic.exe symbols ==="
          x86_64-w64-mingw32-nm test_basic.exe | grep OsThunk | head -10
          
          echo "=== Verifying d3d8thk dependency ==="
          x86_64-w64-mingw32-objdump -p test_basic.exe | grep -i "d3d8thk.dll"
      
      - name: Upload test executables
        uses: actions/upload-artifact@v4
        with:
          name: test-executables-${{ matrix.arch }}
          path: |
            build-test-${{ matrix.arch }}/main.exe
            build-test-d3d8thk/*.exe
          retention-days: 7
  
  # Native Windows testing
  windows-test:
    name: Windows Native Test
    runs-on: windows-latest
    needs: cross-compile-linux
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            make
      
      - name: Build tests with MinGW-w64
        shell: msys2 {0}
        run: |
          mkdir -p build-test-windows
          cd build-test-windows
          
          cmake ../test_project -G "MinGW Makefiles"
          mingw32-make VERBOSE=1
      
      - name: Run basic link test
        shell: msys2 {0}
        run: |
          cd build-test-windows
          echo "=== Running main.exe ==="
          ./main.exe || echo "Exit code: $?"
      
      - name: Build d3d8thk tests (native)
        shell: msys2 {0}
        run: |
          mkdir -p build-test-d3d8thk-windows
          cd build-test-d3d8thk-windows
          
          cmake ../test_d3d8thk -G "MinGW Makefiles"
          mingw32-make VERBOSE=1
      
      - name: Run d3d8thk tests
        shell: msys2 {0}
        continue-on-error: true
        run: |
          cd build-test-d3d8thk-windows
          
          echo "=== Running test_basic.exe ==="
          ./test_basic.exe > test_basic_output.txt 2>&1 || true
          cat test_basic_output.txt
          
          echo ""
          echo "=== Running test_surface.exe ==="
          ./test_surface.exe > test_surface_output.txt 2>&1 || true
          cat test_surface_output.txt
          
          echo ""
          echo "=== Running test_context.exe ==="
          ./test_context.exe > test_context_output.txt 2>&1 || true
          cat test_context_output.txt
          
          echo ""
          echo "=== Running test_draw.exe ==="
          ./test_draw.exe > test_draw_output.txt 2>&1 || true
          cat test_draw_output.txt
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            build-test-d3d8thk-windows/*.txt
          retention-days: 30
  
  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for emojis (STYLE.md violation)
        run: |
          echo "=== Checking for emoji violations ==="
          if grep -r "[🔄✅❌⚠️🔨📁📄🎯⭐🚀✓✗⏭️🏗️]" \
              --include="*.md" \
              --include="*.c" \
              --include="*.cpp" \
              --include="*.h" \
              . 2>/dev/null; then
            echo "ERROR: Found emojis in code/docs (violates STYLE.md)"
            exit 1
          else
            echo "OK: No emojis found"
          fi
      
      - name: Check license files exist
        run: |
          echo "=== Checking license files ==="
          test -f LICENSE-GPL3.txt || { echo "ERROR: LICENSE-GPL3.txt missing"; exit 1; }
          test -f LICENSE-MICROSOFT.txt || { echo "ERROR: LICENSE-MICROSOFT.txt missing"; exit 1; }
          echo "OK: License files present"
      
      - name: Verify GPL3 scope
        run: |
          echo "=== Verifying GPL3 applies to our code only ==="
          grep -q "CMakeLists.txt" LICENSE-GPL3.txt || { echo "ERROR: CMakeLists.txt not in GPL3 scope"; exit 1; }
          grep -q "EXCLUDED.*Microsoft" LICENSE-GPL3.txt || { echo "ERROR: Microsoft files not excluded"; exit 1; }
          echo "OK: GPL3 scope correct"
      
      - name: Check for Microsoft copyright preservation
        run: |
          echo "=== Checking Microsoft headers unchanged ==="
          grep -q "Copyright (C) Microsoft Corporation" d3d8.h || { echo "ERROR: Microsoft copyright missing"; exit 1; }
          grep -q "Copyright (C) Microsoft Corporation" d3dx8.h || { echo "ERROR: Microsoft copyright missing"; exit 1; }
          echo "OK: Microsoft copyrights preserved"
      
      - name: Validate documentation structure
        run: |
          echo "=== Checking documentation files ==="
          test -f README.md || { echo "ERROR: README.md missing"; exit 1; }
          test -f STYLE.md || { echo "ERROR: STYLE.md missing"; exit 1; }
          test -f docs/D3D8_STATUS.md || { echo "ERROR: D3D8_STATUS.md missing"; exit 1; }
          test -f docs/D3D8THK_REFERENCE.md || { echo "ERROR: D3D8THK_REFERENCE.md missing"; exit 1; }
          test -f docs/D3DX8_STATUS.md || { echo "ERROR: D3DX8_STATUS.md missing"; exit 1; }
          test -f docs/TESTING.md || { echo "ERROR: TESTING.md missing"; exit 1; }
          test -f test_d3d8thk/README.md || { echo "ERROR: test_d3d8thk README missing"; exit 1; }
          echo "OK: Documentation structure valid"
      
      - name: Check C++17 standard declaration
        run: |
          echo "=== Checking C++17 in STYLE.md ==="
          grep -q "C++17" STYLE.md || { echo "ERROR: C++17 not declared in STYLE.md"; exit 1; }
          echo "OK: C++17 standard documented"
      
      - name: Verify .editorconfig exists
        run: |
          echo "=== Checking .editorconfig ==="
          test -f .editorconfig || { echo "ERROR: .editorconfig missing"; exit 1; }
          echo "OK: .editorconfig present"
  
  # Summary report
  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [cross-compile-linux, windows-test, code-quality]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# CI Summary for mingw-64bit-support" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Cross-compile (Linux): ${{ needs.cross-compile-linux.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Native: ${{ needs.windows-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.windows-test.result }}" = "success" ]; then
            echo "- Review Windows test results in artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- Check if d3d8thk tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- If all passed, proceed with D3D8 wrapper implementation" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Review Windows test failures" >> $GITHUB_STEP_SUMMARY
            echo "- d3d8thk may have limitations on GitHub runners" >> $GITHUB_STEP_SUMMARY
            echo "- Test on real Windows hardware for validation" >> $GITHUB_STEP_SUMMARY
          fi
