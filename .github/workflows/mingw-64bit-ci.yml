name: MinGW-w64 64-bit Support CI

on:
  push:
    branches:
      - mingw-64bit-support
  pull_request:
    branches:
      - mingw-w64-compatibility
      - main

jobs:
  # Cross-compile from Linux (fast, no Windows needed)
  cross-compile-linux:
    name: Cross-compile Tests (Linux → Windows)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        arch: [i686, x86_64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            cmake \
            build-essential
      
      - name: Verify MinGW-w64 installation
        run: |
          echo "=== Checking ${{ matrix.arch }} toolchain ==="
          ${{ matrix.arch }}-w64-mingw32-gcc --version
          ${{ matrix.arch }}-w64-mingw32-g++ --version
          
          echo "=== Checking d3d8 libraries ==="
          ls -lh /usr/${{ matrix.arch }}-w64-mingw32/lib/libd3d8*.a || echo "No d3d8 libs found (this is OK)"
      
      - name: Build D3D8 standard API tests (32-bit only)
        if: matrix.arch == 'i686'
        run: |
          mkdir -p build-test-d3d8-standard
          cd build-test-d3d8-standard
          
          echo "=== Building Standard D3D8 Test Suite (32-bit) ==="
          cmake ../test_d3d8_standard \
            -DCMAKE_TOOLCHAIN_FILE=../test_project/toolchain-mingw-w64-${{ matrix.arch }}.cmake
          
          make VERBOSE=1
          
          echo ""
          echo "=== Verifying test executables ==="
          ls -lh *.exe
          
          echo ""
          echo "=== Checking test_basic.exe ==="
          file test_basic.exe
          ${{ matrix.arch }}-w64-mingw32-objdump -p test_basic.exe | grep "DLL Name" | grep -i d3d8
          
          echo ""
          echo "=== Checking test_device.exe ==="
          file test_device.exe
          ${{ matrix.arch }}-w64-mingw32-objdump -p test_device.exe | grep "DLL Name" | grep -i d3d8
          
          echo ""
          echo "=== Checking test_rendering.exe ==="
          file test_rendering.exe
          ${{ matrix.arch }}-w64-mingw32-objdump -p test_rendering.exe | grep "DLL Name" | grep -i d3d8
      
      - name: Build d3d8thk tests (64-bit only)
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p build-test-d3d8thk
          cd build-test-d3d8thk
          
          cmake ../test_d3d8thk \
            -DCMAKE_TOOLCHAIN_FILE=../test_project/toolchain-mingw-w64-x86_64.cmake
          
          make VERBOSE=1
      
      - name: Verify d3d8thk test executables (64-bit only)
        if: matrix.arch == 'x86_64'
        run: |
          cd build-test-d3d8thk
          
          echo "=== Built test executables ==="
          ls -lh *.exe
          
          echo "=== Checking test_basic.exe symbols ==="
          x86_64-w64-mingw32-nm test_basic.exe | grep OsThunk | head -10
          
          echo "=== Verifying d3d8thk dependency ==="
          x86_64-w64-mingw32-objdump -p test_basic.exe | grep -i "d3d8thk.dll"
      

      - name: Upload test executables
        uses: actions/upload-artifact@v4
        with:
          name: test-executables-${{ matrix.arch }}
          path: |
            build-test-d3d8-standard/*.exe
            build-test-d3d8thk/*.exe
          retention-days: 7
  
  # Test cross-compiled executables on Windows
  test-cross-compiled:
    name: Test Cross-compiled Executables (Windows)
    runs-on: windows-latest
    needs: cross-compile-linux
    
    strategy:
      matrix:
        arch: [i686, x86_64]
    
    steps:
      - name: Download cross-compiled executables
        uses: actions/download-artifact@v4
        with:
          name: test-executables-${{ matrix.arch }}
          path: test-binaries/
      
      - name: List downloaded files
        shell: cmd
        run: |
          echo === Downloaded test executables ===
          dir /s test-binaries
      
      - name: Test Standard D3D8 API suite (32-bit only)
        if: matrix.arch == 'i686'
        shell: cmd
        continue-on-error: true
        run: |
          cd test-binaries\build-test-d3d8-standard
          
          echo ============================================
          echo Running Standard D3D8 Test Suite (32-bit)
          echo ============================================
          
          echo.
          echo [1/3] test_basic.exe
          test_basic.exe > test_basic_standard.txt 2>&1
          type test_basic_standard.txt
          
          echo.
          echo [2/3] test_device.exe
          test_device.exe > test_device_standard.txt 2>&1
          type test_device_standard.txt
          
          echo.
          echo [3/3] test_rendering.exe
          test_rendering.exe > test_rendering_standard.txt 2>&1
          type test_rendering_standard.txt
      
      - name: Upload standard D3D8 test results (32-bit only)
        if: matrix.arch == 'i686'
        uses: actions/upload-artifact@v4
        with:
          name: standard-d3d8-test-results
          path: test-binaries/build-test-d3d8-standard/*_standard.txt
          retention-days: 30
      
      - name: Test d3d8thk suite (64-bit only)
        if: matrix.arch == 'x86_64'
        shell: cmd
        run: |
          cd test-binaries\build-test-d3d8thk
          
          echo ============================================
          echo Running d3d8thk test suite (cross-compiled)
          echo ============================================
          
          echo.
          echo [1/4] test_basic.exe
          test_basic.exe > test_basic_cross.txt 2>&1
          type test_basic_cross.txt
          
          echo.
          echo [2/4] test_surface.exe
          test_surface.exe > test_surface_cross.txt 2>&1
          type test_surface_cross.txt
          
          echo.
          echo [3/4] test_context.exe
          test_context.exe > test_context_cross.txt 2>&1
          type test_context_cross.txt
          
          echo.
          echo [4/4] test_draw.exe
          test_draw.exe > test_draw_cross.txt 2>&1
          type test_draw_cross.txt
      
      - name: Upload cross-compiled test results
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: cross-compiled-test-results
          path: test-binaries/build-test-d3d8thk/*_cross.txt
          retention-days: 30
  
  # Analyze test outputs
  analyze-results:
    name: Analyze Test Results
    runs-on: ubuntu-latest
    needs: [test-cross-compiled]
    if: always()
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: cross-compiled-test-results
          path: test-results/
        continue-on-error: true
      
      - name: Analyze test outputs
        run: |
          echo "=== Analyzing Cross-compiled Test Results ==="
          
          if [ ! -d "test-results" ] || [ -z "$(ls -A test-results)" ]; then
            echo "No test results found (tests may have failed to run)"
            exit 0
          fi
          
          cd test-results
          
          # Analyze each test
          for test_file in *_cross.txt; do
            if [ ! -f "$test_file" ]; then
              continue
            fi
            
            echo ""
            echo "--- $test_file ---"
            
            if grep -q "All tests passed" "$test_file"; then
              echo "✓ PASSED: All tests succeeded"
            elif grep -q "FAILED.*failed" "$test_file"; then
              failures=$(grep -o "[0-9]* test.*failed" "$test_file" | head -1)
              echo "✗ FAILED: $failures"
              
              # Extract failure reasons
              if grep -qi "GPU driver\|not support" "$test_file"; then
                echo "  Reason: GPU driver limitation (expected on CI)"
              elif grep -qi "device not found\|context creation failed" "$test_file"; then
                echo "  Reason: D3D8 device unavailable (expected)"
              else
                echo "  Reason: Unknown - review full output"
              fi
            else
              echo "? UNKNOWN: Test did not complete normally"
            fi
          done
          
          echo ""
          echo "=== Analysis Complete ==="
          echo "Download artifacts for full test output"
  
  # Summary report
  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [cross-compile-linux, test-cross-compiled, analyze-results]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# CI Summary for mingw-64bit-support" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-compile (Linux) | ${{ needs.cross-compile-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Cross-compiled (Windows) | ${{ needs.test-cross-compiled.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## What Was Tested" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cross-compilation (Linux → Windows)" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ 32-bit (i686): Standard D3D8 API test suite" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ 64-bit (x86_64): d3d8thk wrapper test suite" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Symbol verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**32-bit (i686) - Standard D3D8 API:**" >> $GITHUB_STEP_SUMMARY
          echo "- test_basic.exe: Direct3DCreate8, adapter enumeration" >> $GITHUB_STEP_SUMMARY
          echo "- test_device.exe: Device creation, capabilities" >> $GITHUB_STEP_SUMMARY
          echo "- test_rendering.exe: BeginScene, Clear, Present" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**64-bit (x86_64) - d3d8thk Wrapper:**" >> $GITHUB_STEP_SUMMARY
          echo "- test_basic.exe: DirectDraw object management" >> $GITHUB_STEP_SUMMARY
          echo "- test_surface.exe: Surface operations" >> $GITHUB_STEP_SUMMARY
          echo "- test_context.exe: D3D context lifecycle" >> $GITHUB_STEP_SUMMARY
          echo "- test_draw.exe: Drawing primitives" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Cross-compiled Executables on Windows" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test-cross-compiled.result }}" = "success" ]; then
            echo "- ✓ Cross-compiled binaries executed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ Standard D3D8 tests run (32-bit baseline)" >> $GITHUB_STEP_SUMMARY
            echo "- ✓ d3d8thk tests run (64-bit comparison)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Purpose:** Compare 32-bit standard D3D8 with 64-bit d3d8thk to assess wrapper viability." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Tests may fail due to GPU driver limitations (expected on GitHub runners)." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✗ Cross-compiled tests did not complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Check job logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.cross-compile-linux.result }}" = "success" ]; then
            echo "### ✓ Ready to Proceed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Download test executables from artifacts" >> $GITHUB_STEP_SUMMARY
            echo "2. Run tests on real Windows hardware (not VM/CI)" >> $GITHUB_STEP_SUMMARY
            echo "3. If d3d8thk tests pass, begin D3D8 wrapper implementation" >> $GITHUB_STEP_SUMMARY
            echo "4. If tests fail, document limitations in docs/D3D8THK_REFERENCE.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✗ Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Fix the following before proceeding:" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.cross-compile-linux.result }}" != "success" ]; then
              echo "- Fix cross-compilation errors" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **test-executables-i686**: 32-bit standard D3D8 test suite (3 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- **test-executables-x86_64**: 64-bit d3d8thk test suite (4 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- **standard-d3d8-test-results**: Standard D3D8 test output (32-bit baseline)" >> $GITHUB_STEP_SUMMARY
          echo "- **cross-compiled-test-results**: d3d8thk test output (64-bit comparison)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**For comparison analysis:** Download both result artifacts and compare behavior." >> $GITHUB_STEP_SUMMARY
